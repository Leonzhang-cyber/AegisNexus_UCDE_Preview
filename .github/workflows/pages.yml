name: Deploy synthetic UI preview
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: public-preview-pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Prepare HTML preview only
        run: |
          mkdir -p /tmp/ucde-site
          cp index.html /tmp/ucde-site/index.html
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: /tmp/ucde-site
      - id: deployment
        uses: actions/deploy-pages@v4
      - name: Verify hosted preview in a browser
        env:
          PUBLIC_PREVIEW_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          npm install --prefix /tmp/ucde-browser --ignore-scripts playwright@1.56.1
          /tmp/ucde-browser/node_modules/.bin/playwright install --with-deps chromium
          node --input-type=module <<'JS'
          import { chromium } from '/tmp/ucde-browser/node_modules/playwright/index.mjs';
          import { readFile, mkdir } from 'node:fs/promises';
          import assert from 'node:assert/strict';
          import { createHash } from 'node:crypto';
          const url = process.env.PUBLIC_PREVIEW_URL;
          assert.ok(url?.startsWith('https://leonzhang-cyber.github.io/'));
          const expected = await readFile('index.html');
          let verified = false;
          for (let attempt = 0; attempt < 30; attempt++) {
            try {
              const response = await fetch(url);
              if (response.status === 200) {
                const body = Buffer.from(await response.arrayBuffer());
                if (body.equals(expected)) { verified = true; break; }
              }
            } catch {}
            await new Promise(resolve => setTimeout(resolve, 1000));
          }
          assert.equal(verified, true, 'Hosted content must match the exact preview HTML');
          const browser = await chromium.launch();
          try {
            const page = await browser.newPage({ viewport: { width: 1440, height: 1000 } });
            const errors = []; const writes = [];
            page.on('pageerror', e => errors.push(e.message));
            page.on('request', r => { if (!['GET','HEAD'].includes(r.method())) writes.push(r.url()); });
            await page.goto(url);
            const verdict = page.locator('#verdict');
            await verdict.filter({ hasText: 'Contract valid' }).waitFor();
            assert.equal(await page.locator('html').getAttribute('lang'), 'en');
            assert.equal(await page.evaluate(() => /[\u4e00-\u9fff]/.test(document.body.innerText)), false);
            for (const role of ['owner','approver','executor','supervisor','auditor','admin']) {
              await page.selectOption('#role', role);
              assert.equal(await page.locator('#priorities>li').count(), 3);
              assert.equal(await page.locator('#authorize').isVisible(), ['approver','executor'].includes(role));
            }
            for (const scenario of ['human','ai','mixed','revision','missing-evidence','cross-tenant','approval-mismatch']) {
              await page.selectOption('#scenario', scenario);
              await verdict.filter({ hasText: ['missing-evidence','cross-tenant','approval-mismatch'].includes(scenario) ? 'Contract rejected' : 'Contract valid' }).waitFor();
            }
            await page.selectOption('#scenario', 'revision');
            await verdict.filter({ hasText: 'Contract valid' }).waitFor();
            await page.selectOption('#role', 'approver');
            await page.click('#authorize');
            await page.keyboard.press('Escape');
            assert.equal(await page.locator('#authorization-dialog').isVisible(), false);
            await page.click('#authorize');
            await page.fill('#reason', 'Hosted UI verification only.');
            await page.locator('#authorization-form button[type=submit]').click();
            assert.equal(await page.locator('#confirm-authorization').isDisabled(), true);
            await page.fill('#confirm-id', 'decision-1');
            await page.click('#confirm-authorization');
            assert.match(await page.locator('#authorization-result').textContent(), /No live approval/);
            await mkdir('/tmp/ucde-hosted-evidence', { recursive: true });
            await page.evaluate(() => window.scrollTo(0,0));
            await page.screenshot({ path: '/tmp/ucde-hosted-evidence/desktop.png' });
            await page.setViewportSize({ width: 390, height: 844 });
            assert.equal(await page.evaluate(() => document.documentElement.scrollWidth <= window.innerWidth), true);
            await page.screenshot({ path: '/tmp/ucde-hosted-evidence/mobile.png', fullPage: true });
            assert.deepEqual(errors, []); assert.deepEqual(writes, []);
            console.log('::notice::Hosted preview verified: HTTP 200, exact HTML SHA-256 ' + createHash('sha256').update(expected).digest('hex') + ', English, 6 roles, 7 scenarios, two-step confirmation, cancel, mobile layout, no live write requests. URL: ' + url);
          } finally { await browser.close(); }
          JS
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hosted-ui-verification
          path: /tmp/ucde-hosted-evidence/
          if-no-files-found: ignore
